# Supabase CLI-konfigurasjon for Flippsjekk. Gjelder LOKAL utvikling (`supabase start`) og er migrasjonenes hjem i repoet.
# Innstillingene for det hostede prosjektet (Auth-leverandører, e-postmaler, rate limits, URL-er) settes i Supabase Dashboard
# og er IKKE en del av denne fasen – se docs/supabase.md. Ingen hemmeligheter skal stå i denne filen.

project_id = "flippsjekk"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Må stemme med Postgres-versjonen i Supabase-prosjektet. Migrasjonene forutsetter PostgreSQL 15 eller nyere
# (ON DELETE SET NULL med kolonneliste).
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
